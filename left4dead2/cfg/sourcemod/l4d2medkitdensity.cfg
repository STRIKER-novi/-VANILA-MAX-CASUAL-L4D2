// ===============================
// L4D2 Medkit Density - Configuración
// Este plugin controla la cantidad y tipo de botiquines
// que aparecen en el mapa.
// ===============================

// sm_md_enabled
// Activa o desactiva el plugin.
// 1 = Activado
// 0 = Desactivado
// Si está desactivado el plugin no modifica nada del juego.
sm_md_enabled "1"


// sm_md_outdoors
// Controla qué hacer con los botiquines que aparecen en zonas exteriores del mapa.
//
// 0 = No hacer nada (usar el comportamiento normal del juego)
// 1 = Cambiar la cantidad usando sm_md_outdoors_medkitcount
// 2 = Eliminar todos los botiquines exteriores
// 3 = Reemplazar los botiquines por píldoras
// 4 = Reemplazar los botiquines por desfibriladores
// 5 = Botiquines infinitos
sm_md_outdoors "3"


// sm_md_outdoors_medkitcount
// Si sm_md_outdoors está en 1, esta opción define
// cuántos botiquines aparecerán en exteriores.
//
// mínimo: 2
// máximo: 10
//sm_md_outdoors_medkitcount "2"


// sm_md_saferoom
// Controla qué hacer con los botiquines dentro de los SAFE ROOM
// (los cuartos seguros donde empieza o termina el mapa).
//
// 0 = No cambiar nada
// 1 = Cambiar cantidad usando sm_md_saferoom_medkitcount
// 2 = Eliminar botiquines
// 3 = Reemplazar botiquines por píldoras
// 4 = Reemplazar botiquines por desfibriladores
// 5 = Botiquines infinitos
// 6 = Cambiar cada botiquín por un desfibrilador
sm_md_saferoom "0"


// sm_md_saferoom_medkitcount
// Cantidad de botiquines que aparecerán en los safe rooms
// si sm_md_saferoom está en 1.
//
// mínimo: 4
// máximo: 20
//sm_md_saferoom_medkitcount "4"


// sm_md_start
// Controla los botiquines que aparecen al inicio del mapa.
//
// En Coop: inicio de campaña
// En Versus: inicio de cada mapa
//
// 0 = No cambiar nada
// 1 = Cambiar cantidad usando sm_md_start_medkitcount
// 2 = Eliminar botiquines
// 3 = Reemplazar botiquines por píldoras
// 4 = Reemplazar botiquines por desfibriladores
// 5 = Botiquines infinitos
// 6 = Cambiar cada botiquín por un desfibrilador
sm_md_start "0"


// sm_md_start_medkitcount
// Cantidad de botiquines al inicio del mapa
// si sm_md_start está en 1.
//
// mínimo: 4
// máximo: 20
//sm_md_start_medkitcount "8"


// sm_md_versusonly
// Define en qué modos se aplican los cambios.
//
// 0 = Aplicar en todos los modos
//     (coop, realism, versus, teamversus)
//
// 1 = Aplicar solo en
//     versus y teamversus
sm_md_versusonly "0"